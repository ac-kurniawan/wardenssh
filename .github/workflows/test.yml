name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.26.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile
        shell: bash
        run: |
          set -eu
          case "${{ matrix.os }}" in
            windows-latest) target="linux/amd64" ;;
            macos-latest)   target="windows/amd64" ;;
            *)              target="darwin/amd64" ;;
          esac
          echo "Cross-compiling for ${target}"
          GOOS="${target%/*}" GOARCH="${target#*/}" go build -o wardenssh-cross .
