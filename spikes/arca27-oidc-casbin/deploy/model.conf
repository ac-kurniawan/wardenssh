# ARCA-27 spike — RBAC model: role-based permissions over a namespaced
# permission string "module.resource.action" (e.g. assets.asset.read).
#
# r = (subject, permission)      — subject is the OIDC token subject
# p = (role, permission-glob)    — e.g. "accounting.*" or "*.read"
# g = (subject, role)            — role assignment (user_grant from IdP)
#
# The matcher uses globMatch so policies can be:
#   *                admin — everything
#   accounting.*     all accounting actions
#   *.read           read-only everywhere
[request_definition]
r = sub, perm

[policy_definition]
p = role, perm

[policy_effect]
e = some(where (p.eft == allow))

[role_definition]
g = _, _

[matchers]
m = g(r.sub, p.role) && globMatch(r.perm, p.perm)
